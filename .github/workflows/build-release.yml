name: Build SMServer release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build rootless debs
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          sudo xcode-select -s "/Applications/${XCODE}/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install ldid cocoapods
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      - name: Apply tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^Version:.*/Version: ${VERSION}/" libsmserver/control package/DEBIAN/control
          echo "event=version_applied version=${VERSION}"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          ./package/build-rootless.sh

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: smserver-rootless-debs
          path: package/out/*.deb

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SMServer ${{ github.ref_name }} – rootless iOS 15/16"
          body: |
            ## SMServer – rootless iOS 15/16 (Dopamine / palera1n)

            1. Install the `com.janshai.libsmserver` deb
            2. Install the `com.ianwelker.smserver` deb (its postinst resprings)
            3. On Dopamine, make sure every installed Mach-O is in the jailbreak trust cache (`package/device-install.sh` does this)
            4. Open SMServer and start the server
          files: artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
